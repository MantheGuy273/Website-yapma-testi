<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fikirler</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      color: #20231f;
      background: #f7f7f2;
    }

    * { box-sizing: border-box; }
    body { margin: 0; }
    main {
      width: min(760px, calc(100% - 40px));
      margin: 0 auto;
      padding: 48px 0 64px;
    }
    header {
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #dedfd7;
    }
    header a {
      color: inherit;
      text-decoration: none;
      font-weight: 700;
    }
    h1 {
      margin: 18px 0 12px;
      font-size: clamp(2.2rem, 6vw, 4rem);
      letter-spacing: -0.06em;
      line-height: 1.1;
    }
    .eyebrow {
      color: #68715e;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      color: #3f443e;
      font-size: 1.05rem;
      line-height: 1.8;
    }
    .item {
      border: 1px solid #dfe2d8;
      border-radius: 10px;
      margin-bottom: 12px;
      background: #fff;
      overflow: hidden;
    }
    .item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border: none;
      background: transparent;
      padding: 16px 18px;
      text-align: left;
      font: inherit;
      cursor: pointer;
      color: inherit;
    }
    .item-title {
      flex: 1;
      padding-right: 12px;
    }
    .arrow {
      font-size: 1.2rem;
      transition: transform 0.2s ease;
      color: #293426;
    }
    .item.open .arrow {
      transform: rotate(90deg);
    }
    .item-content {
      display: none;
      padding: 0 18px 18px;
      border-top: 1px solid #edf0ea;
      background: #fafaf7;
    }
    .item.open .item-content {
      display: block;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .stat {
      padding: 10px 12px;
      border-radius: 8px;
      background: #eef1e9;
    }
    .stat-label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #68715e;
      margin-bottom: 4px;
    }
    .button {
      display: inline-block;
      margin-top: 22px;
      padding: 12px 18px;
      border-radius: 5px;
      background: #293426;
      color: white;
      text-decoration: none;
      font-weight: 700;
    }
    .button:hover {
      background: #46563f;
    }
    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 22px 0 18px;
    }
    select {
      padding: 10px 12px;
      border: 1px solid #d0d3ca;
      border-radius: 6px;
      background: white;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <a href="index.html">← Back home</a>
    </header>

    <div class="eyebrow">Tübitak 4006 fikirler</div>
    <h1 id="about-page-title">Tüm fikirler</h1>

    <div class="controls">
      <label>
        <span>Filtrele:</span>
        <select id="filter-select">
          <option value="all">Hepsi</option>
          <option value="creative">Teknoloji ve Tasarım</option>
          <option value="learning">Biyoloji</option>
          <option value="kimya">Kimya</option>
        </select>
      </label>

      <label>
        <span>Sıralama</span>
        <select id="sort-select">
          <option value="difficulty-desc">En zor → En kolay</option>
          <option value="difficulty-asc">En kolay → En zor</option>
          <option value="alpha">A–Z</option>
        </select>
      </label>

      <label>
        <span>Difficulty:</span>
        <select id="difficulty-filter">
          <option value="all">Tüm zorluklar</option>
          <option value="1-0.75">1.00 → 0.75</option>
          <option value="0.75-0.5">0.75 → 0.50</option>
          <option value="0.5-0.25">0.50 → 0.25</option>
          <option value="0.25-0.01">0.25 → 0.01</option>
        </select>
      </label>

    </div>

    <ul id="about-items"></ul>

    <a class="button" href="index.html">Geri dön</a>
  </main>

  <script>
    const aboutItems = [
      {
        id: 1,
        category: "learning",
        order: 1,
        hard: "This is a challenge because it requires patience and constant practice.",
        fun: "This is exciting because learning new ideas keeps me curious and motivated.",
        text: "Dijital Herbaryum.",
        description: "Bu, imkanlı ve 3 boyutlu tasarım ile kolayca yapılabilir.",
        stats: {
          difficulty: 0.40,
          goodness: 0.9,
          type: "Biyoloji"
        }
      },
      {
        id: 2,
        category: "creative",
        order: 2,
        hard: "This can be difficult because creative work takes effort and revision.",
        fun: "This is fun because design and coding let me create something original.",
        text: "tbc",
        description: "Daha imkanlı olduğunu bilmiyorum, ve iyi puan almayabilir emin değilim.",
        stats: {
          difficulty: -0.60,
          goodness: 0.00,
          type: "Teknoloji ve Tasarım"
        }
      },
      {
        id: 3,
        category: "kimya",
        order: 3,
        hard: "This part is challenging because technology can be complex and overwhelming.",
        fun: "This is enjoyable because I like discovering how things work and improving them.",
        text: "Bir website/oyun kullanarak kolayca yeni bir element yapmak ",
        description: "Elementlerin veya bitkilerin moleküllerinin nasıl kendilerini etkilediğini daha bilmiyorum ve araştırma yapmadım",
        stats: {
          difficulty: 0.80,
          goodness: 0.60,
          type: "Kimya"
        }
      },
      {
        id: 4,
        category: "personal",
        order: 4,
        hard: "This can be hard because working with others takes communication and patience.",
        fun: "This is fun because teamwork helps me share ideas and grow with others.",
        text: "tbc",
        description: "Sharing ideas and taking on challenges as a team.",
        stats: {
          difficulty: -0.50,
          goodness: 0.00,
          type: "Teamwork"
        }
      },
      {
        id: 5,
        category: "learning",
        order: 5,
        hard: "This is hard because getting better takes time and effort.",
        fun: "This is rewarding because improving my skills feels meaningful and exciting.",
        text: "Bir ağacın verdiği meyvenin tadını, şeklini ve görünümnü değiştirmek ve bunu kolayca bir şekilde yapmak veya göstermek",
        description: "--İmkansız araştırma yapılırsa imkanlı olabilir--",
        stats: {
          difficulty: 1,
          goodness: 0.87,
          type: "Biyoloji"
        }
      },
      {
        id: 6,
        category: "creative",
        order: 6,
        hard: "This is difficult because ideas need testing and refining.",
        fun: "This is fun because experimenting with new concepts feels creative and fresh.",
        text: "tbc",
        description: "Testing and improving new ideas through hands-on experiments.",
        stats: {
          difficulty: -0.60,
          goodness: 0.00,
          type: "Teknoloji ve Tasarım"
        }
      }
    ];

    const titleElement = document.getElementById("about-page-title");
    const listElement = document.getElementById("about-items");
    const filterSelect = document.getElementById("filter-select");
    const sortSelect = document.getElementById("sort-select");
    const difficultyFilter = document.getElementById("difficulty-filter");

    const getDifficultyColor = (score) => {
      if (score >= 0.90) return { base: "#2a2d31", accent: "#6c7278", glow: "rgba(30, 32, 35, 0.25)" };
      if (score >= 0.70) return { base: "#7e6ad8", accent: "#d7d0ff", glow: "rgba(126, 106, 216, 0.22)" };
      if (score >= 0.50) return { base: "#e17a6c", accent: "#ffd4cb", glow: "rgba(225, 122, 108, 0.22)" };
      if (score >= 0.30) return { base: "#e8c75c", accent: "#fff1b0", glow: "rgba(232, 199, 92, 0.22)" };
      return { base: "#73c983", accent: "#d9f7d7", glow: "rgba(115, 201, 131, 0.22)" };
    };

    const getRange = (value) => {
      if (value === "all") return [0, 1];
      if (value === "1-0.75") return [0.75, 1.00];
      if (value === "0.75-0.5") return [0.50, 0.75];
      if (value === "0.5-0.25") return [0.25, 0.50];
      return [0.01, 0.25];
    };

    const getFilteredItems = () => {
      const filterValue = filterSelect.value;
      const difficultyRange = getRange(difficultyFilter.value);

      let visibleItems = filterValue === "all"
        ? [...aboutItems]
        : aboutItems.filter((item) => {
            if (filterValue === "kimya") {
              return item.stats.type.toLowerCase().includes("kimya");
            }
            if (filterValue === "learning") {
              return item.category === "learning";
            }
            return item.category === filterValue;
          });

      visibleItems = visibleItems.filter((item) =>
        item.stats.difficulty >= difficultyRange[0] && item.stats.difficulty <= difficultyRange[1]
      );

      const sortValue = sortSelect.value;

      return visibleItems.sort((a, b) => {
        if (sortValue === "alpha") {
          return a.text.localeCompare(b.text);
        }
        if (sortValue === "difficulty-desc") {
          return b.stats.difficulty - a.stats.difficulty;
        }
        if (sortValue === "difficulty-asc") {
          return a.stats.difficulty - b.stats.difficulty;
        }
        return a.order - b.order;
      });
    };

    const renderItems = () => {
      listElement.innerHTML = "";
      const items = getFilteredItems();
      const showDifficultyColors = sortSelect.value === "difficulty-desc" || sortSelect.value === "difficulty-asc";

      items.forEach((item) => {
        const listItem = document.createElement("li");
        listItem.className = "item";

        const difficultyColor = getDifficultyColor(item.stats.difficulty);
        listItem.style.borderColor = showDifficultyColors ? difficultyColor.base : "#dfe2d8";

        const header = document.createElement("button");
        header.className = "item-header";
        header.type = "button";
        header.style.background = `linear-gradient(135deg, rgba(255,255,255,0.96), rgba(255,255,255,0.82))`;
        header.style.borderRadius = showDifficultyColors ? "9px 9px 0 0" : "0";
        header.style.border = showDifficultyColors ? `2px solid ${difficultyColor.base}` : "1px solid #dfe2d8";
        header.style.boxShadow = showDifficultyColors
          ? `inset 0 0 0 2px ${difficultyColor.accent}, 0 0 0 2px ${difficultyColor.glow}`
          : "none";
        header.style.color = "#1f1f22";
        header.innerHTML = `
          <span class="item-title">${item.text}</span>
          <span class="arrow">›</span>
        `;

        const content = document.createElement("div");
        content.className = "item-content";
        content.style.color = "#1f1f22";
        content.style.borderTop = showDifficultyColors ? `1px solid ${difficultyColor.accent}` : "1px solid #edf0ea";
        content.style.background = showDifficultyColors
          ? `linear-gradient(180deg, rgba(255,255,255,0.95), ${difficultyColor.glow})`
          : "#fafaf7";
        content.innerHTML = `
          <div class="stats">
            <div class="stat"><span class="stat-label">Zorluk seviyesi</span><strong>${item.stats.difficulty.toFixed(2)}</strong></div>
            <div class="stat"><span class="stat-label">Kalite/etki seviyesi</span><strong>${item.stats.goodness.toFixed(2)}</strong></div>
            <div class="stat"><span class="stat-label">Ana ders</span><strong>${item.stats.type}</strong></div>
            <div class="stat"><span class="stat-label">Neden bu zorluk?</span><strong>${item.description}</strong></div>
          </div>
        `;

        header.addEventListener("click", () => {
          listItem.classList.toggle("open");
        });

        listItem.appendChild(header);
        listItem.appendChild(content);
        listElement.appendChild(listItem);
      });
    };

    titleElement.textContent = "Tüm fikirler";
    filterSelect.addEventListener("change", renderItems);
    sortSelect.addEventListener("change", renderItems);
    difficultyFilter.addEventListener("change", renderItems);
    renderItems();
  </script>
</body>
</html>
