<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Name — Home</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      color: #20231f;
      background: #f7f7f2;
    }

    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(760px, calc(100% - 40px)); margin: 0 auto; }
    header { padding: 28px 0; border-bottom: 1px solid #dedfd7; }
    header a { color: inherit; text-decoration: none; font-weight: 700; }
    section { padding: 70px 0; border-bottom: 1px solid #dedfd7; }
    .intro { padding-top: 100px; }
    .eyebrow { color: #68715e; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
    h1 { max-width: 650px; margin: 16px 0; font-size: clamp(2.7rem, 8vw, 5rem); line-height: 1.02; letter-spacing: -0.06em; }
    h2 { margin: 0 0 18px; font-size: 1.5rem; }
    p { max-width: 600px; color: #555a52; font-size: 1.08rem; line-height: 1.75; }
    .button { display: inline-block; margin-top: 14px; padding: 13px 18px; border-radius: 5px; background: #293426; color: white; text-decoration: none; font-weight: 700; }
    .button:hover { background: #46563f; }
    footer { padding: 28px 0 40px; color: #68715e; font-size: 0.9rem; }
    @media (max-width: 520px) {
      .intro { padding-top: 72px; }
      section { padding: 52px 0; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <a href="#top">Tübitak 4006 fikirler</a>
    </header>

    <section class="intro" id="top">
      <div class="eyebrow">website yapma testi</div>
      <h1>Tübitak 4006 Fikirler</h1>
      <p>Bulabildiğim tüm tübitak fikirleri ve gelecek projelerde yardım olsun diye website testi</p>
      <a class="button" href="about.html">Projelere bak</a>
    </section>
  </main>
</body>
</html>
